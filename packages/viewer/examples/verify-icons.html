<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>图标视觉统一验证（ADR-0033）</title>
  </head>
  <body>
    <!-- 自检页：断言全部写入 #result，由 examples/cdp-run.ts 轮询收割 -->
    <div id="result" style="white-space: pre-wrap; font: 13px/1.7 monospace; padding: 12px">PENDING</div>
    <script>
      // 诊断信号：模块加载/运行错误立即上屏（否则 cdp-run 恒收 PENDING 无从排查）
      window.addEventListener('error', (e) => {
        document.getElementById('result').textContent =
          'PAGE-ERROR ' + e.message + ' @ ' + (e.filename || '') + ':' + e.lineno
      })
      window.addEventListener('unhandledrejection', (e) => {
        document.getElementById('result').textContent = 'PAGE-REJECT ' + (e.reason?.stack ?? e.reason)
      })
    </script>
    <!-- A：默认源 lucide（线型系重写）+ 内置图标同屏 + caret/菜单 -->
    <autostore-viewer id="va" show-actions="2"></autostore-viewer>
    <!-- B：覆写 material-symbols-light（填充系不重写，自担风格差） -->
    <autostore-viewer
      id="vb"
      icon-url="https://api.iconify.design/material-symbols-light.json?icons={names}"
    ></autostore-viewer>
    <!-- C：slot 自定义图标 + 自定义 --viewer-icon-size（viewBox 小写化回归验证） -->
    <autostore-viewer id="vc" style="--viewer-icon-size: 18px">
      <template slot="icons">
        <symbol id="custom-box" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 12h16"/><path d="M12 4v16"/></symbol>
      </template>
    </autostore-viewer>

    <script type="module">
      import { AutoStore, configurable } from 'autostore'
      import '../src/autostore-viewer.ts'

      const results = []
      const assert = (name, cond, detail = '') => {
        results.push(`${cond ? 'PASS' : 'FAIL'} ${name}${detail ? ' — ' + detail : ''}`)
      }
      const waitFor = async (fn, timeout = 7000) => {
        const t0 = Date.now()
        while (Date.now() - t0 < timeout) {
          const v = fn()
          if (v) return v
          await new Promise((r) => setTimeout(r, 300))
        }
        return null
      }

      // A：远程名 home/star（默认 lucide 攒批拉取）+ 内置 object 同屏 + dropdown(caret+菜单项图标)
      const storeA = new AutoStore({
        home: configurable('首页', { label: '首页', icon: 'home' }),
        star: configurable('收藏', { label: '收藏', icon: 'star' }),
        plain: { a: 1, b: [true, false] },
        theme: configurable('深色', {
          label: '主题',
          actions: [
            {
              type: 'dropdown',
              label: '主题',
              caret: true,
              items: [
                { label: '浅色', icon: 'sun' },
                { label: '深色', icon: 'moon' },
              ],
            },
          ],
        }),
      })
      // B：同名 home 走覆写的 material 源（各自 shadow root 的动态 sprite 互不干扰）
      const storeB = new AutoStore({
        home: configurable('首页', { label: '首页', icon: 'home' }),
      })
      // C：slot 自定义图标（容器+元素节点同图标，18px 容器）
      const storeC = new AutoStore({
        box: configurable(['a', 'b'], { label: '容器', icon: 'custom-box' }),
      })

      const va = document.getElementById('va')
      const vb = document.getElementById('vb')
      const vc = document.getElementById('vc')
      va.store = storeA
      vb.store = storeB
      vc.store = storeC

      const dynamicSymbol = (viewer, id) =>
        viewer.shadowRoot.querySelector(`.dynamic-sprite symbol[id="${id}"]`)
      const builtinSymbol = (viewer, id) =>
        viewer.shadowRoot.querySelector(`svg:not(.dynamic-sprite) symbol[id="${id}"]`)

      async function main() {
        // 阶段标记写 title 而非 #result：cdp-run 以 #result 非 PENDING 为完成信号
        const stage = (s) => { document.title = 'RUNNING ' + s }
        stage('start')
        // —— 拉取链（默认 lucide）：注册 + 线宽重写 ——
        stage('wait-homeA')
        const homeA = await waitFor(() => dynamicSymbol(va, 'asv-home'))
        assert('A. lucide 拉取注册（asv-home symbol 注入动态 sprite）', !!homeA)
        if (homeA) {
          assert(
            'A. 拉取 symbol 注入公共属性 stroke-width=1.5',
            homeA.getAttribute('stroke-width') === '1.5',
            `实际=${homeA.getAttribute('stroke-width')}`,
          )
          assert(
            'A. 拉取 symbol fill=none / stroke=currentColor',
            homeA.getAttribute('fill') === 'none' && homeA.getAttribute('stroke') === 'currentColor',
          )
          const inline = homeA.querySelectorAll('[stroke-width]')
          assert(
            'A. body 内联 stroke-width 全部删除（lucide 自带 2 已剥离）',
            inline.length === 0,
            `残留=${inline.length}`,
          )
          assert('A. viewBox 0 0 24 24', homeA.getAttribute('viewBox') === '0 0 24 24', homeA.getAttribute('viewBox'))
          const useEl = va.shadowRoot.querySelector('.type-icon use')
          const rect = useEl ? useEl.getBoundingClientRect() : { width: 0, height: 0 }
          assert('A. 远程图标 use 引用壳渲染非零（href 带 # 坑回归）', rect.width > 0 && rect.height > 0, `rect=${rect.width}x${rect.height}`)
        }

        // —— 覆写链（material 填充系）：不重写 ——
        stage('wait-homeB')
        const homeB = await waitFor(() => dynamicSymbol(vb, 'asv-home'))
        assert('B. 覆写 material 源拉取注册', !!homeB)
        if (homeB) {
          assert(
            'B. 填充系 symbol 不注入 stroke 公共属性',
            homeB.getAttribute('stroke-width') === null && homeB.getAttribute('stroke') === null,
          )
          assert(
            'B. 填充系 body 自带 fill=currentColor 原样保留',
            !!homeB.querySelector('[fill="currentColor"]'),
          )
        }

        // —— 内置 sprite：chevron-sm 变体与原版并存 ——
        const sm = builtinSymbol(va, 'asv-chevron-sm')
        assert('C. 内置 asv-chevron-sm 粗线变体存在', !!sm)
        if (sm) {
          assert('C. chevron-sm stroke-width=2.75', sm.getAttribute('stroke-width') === '2.75', sm.getAttribute('stroke-width'))
        }
        const expandUse = va.shadowRoot.querySelector('.expand-icon use')
        assert(
          'C. 树折叠 chevron 保持原版（#asv-chevron）',
          expandUse?.getAttribute('href') === '#asv-chevron',
          expandUse?.getAttribute('href'),
        )

        // —— dropdown：caret 换用变体 + 菜单项 16px ——
        stage('dropdown')
        // 无 icon 的 dropdown 触发按钮是 node-tool-text 形态
        const trigger = await waitFor(() => va.shadowRoot.querySelector('.node-action-menu > span'))
        if (trigger) {
          trigger.click() // 打开菜单
        }
        const caretUse = va.shadowRoot.querySelector('.action-caret use')
        assert(
          'D. dropdown caret 引用 #asv-chevron-sm',
          caretUse?.getAttribute('href') === '#asv-chevron-sm',
          caretUse?.getAttribute('href'),
        )
        const menuSvg = await waitFor(() => va.shadowRoot.querySelector('.action-menu-item svg'))
        if (menuSvg) {
          const w = getComputedStyle(menuSvg).width
          assert('D. 菜单项图标 16px', w === '16px', `computed=${w}`)
          const mRect = menuSvg.getBoundingClientRect()
          assert('D. 菜单项图标渲染非零', mRect.width > 0)
        } else {
          assert('D. 菜单项图标渲染（打开菜单后）', false, '未找到 .action-menu-item svg')
        }

        // —— slot 自定义：viewBox 小写化修复（18px 容器显示不全回归） ——
        stage('slot-custom')
        const customBox = await waitFor(() => dynamicSymbol(vc, 'asv-custom-box'))
        assert('E. slot 自定义图标注册（asv-custom-box）', !!customBox)
        if (customBox) {
          assert(
            'E. 重建后 viewBox 属性有效（HTML 小写化 viewbox 修正为 viewBox）',
            customBox.getAttribute('viewBox') === '0 0 24 24',
            `viewBox=${customBox.getAttribute('viewBox')}`,
          )
          const cUse = vc.shadowRoot.querySelector('.type-icon svg')
          if (cUse) {
            const w = getComputedStyle(cUse).width
            const cRect = cUse.getBoundingClientRect()
            assert('E. 18px 容器下 use 壳 18px 且渲染非零', w === '18px' && cRect.width > 0, `computed=${w} rect=${cRect.width.toFixed(1)}`)
          } else {
            assert('E. 18px 容器 use 壳渲染', false, '未找到 .type-icon svg')
          }
        }

        const failed = results.filter((r) => r.startsWith('FAIL')).length
        results.push(`—— TOTAL ${results.length} 断言，${failed} 失败 ——`)
        document.getElementById('result').textContent = results.join('\n')
      }

      main().catch((e) => {
        document.getElementById('result').textContent = `PAGE-FAIL ${e?.stack ?? e}`
      })
    </script>
  </body>
</html>
