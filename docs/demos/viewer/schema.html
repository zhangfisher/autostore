<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Schema 元数据显示</title>
    <script src="/autostore/autostore.js"></script>
    <script src="/autostore/viewer.js"></script>
    <style>
      body { margin: 0; padding: 12px; font-family: system-ui, -apple-system, sans-serif; }
      p { margin: 8px 0 4px; font-size: 13px; color: #6b7280; }
      autostore-viewer {
        display: block;
        height: 200px;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <p>schema 生效（默认）：label 替换 key、required 显示红星、help 作为整行 title 提示、choices 把值显示为 label、prefix/suffix 值装饰、icon 换图标</p>
    <autostore-viewer id="a"></autostore-viewer>

    <p>disable-schema：关闭 schema 展示词汇（仅影响显示；编辑时的 widget 决策与校验、schema.icon 仍读取 schema）</p>
    <autostore-viewer id="b" disable-schema></autostore-viewer>

    <script>
      const { AutoStore, configurable } = AutoStoreSpaces

      const store = new AutoStore({
        name: configurable('张三', {
          label: '姓名',
          help: 'label 替换 key 显示，help 渲染为整行 title 提示',
          icon: 'user',
        }),
        email: configurable('zhangsan@example.com', { label: '邮箱', required: true }),
        role: configurable('admin', {
          label: '角色',
          help: 'choices 命中后显示层替换为对应 label',
          choices: [
            { label: '管理员', value: 'admin' },
            { label: '访客', value: 'guest' },
          ],
        }),
        price: configurable(100, { label: '价格', prefix: '¥', suffix: ' / 件' }),
        plain: '无 schema 的普通状态',
      })

      document.getElementById('a').store = store
      document.getElementById('b').store = store
    </script>
  </body>
</html>
