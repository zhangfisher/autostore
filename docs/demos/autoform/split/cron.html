<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>AutoStore — 按需引入（core + cron 双 script）</title>
        <link rel="stylesheet" href="/autostore/autoform.dark.css" />
        <link rel="stylesheet" href="/autostore/autoform.light.css" />
        <script src="/autostore/autostore.js"></script>
        <!-- 按需引入：先 core（lit 单例宿主 + AutoFormCore 命名空间），后 widget 产物 -->
        <script src="/autostore/autoform/core.global.js"></script>
        <script src="/autostore/autoform/cron.global.js"></script>
    </head>

    <body style="overflow: hidden; padding: 1em 0px">
        <div style="display: flex; flex-direction: column">
            <auto-form id="form" labelpos="left"></auto-form>
            <div id="viewer" style="padding: 1em; border: 1px solid #ccc; margin-top: 1em"></div>
        </div>
        <script>
            const { AutoStore, configurable } = AutoStoreSpaces;
            const store = new AutoStore({
                basic: configurable('', {
                    label: '执行周期',
                    widget: 'cron',
                    placeholder: '请选择执行周期',
                }),
                // 未声明 widget 的字段走 input（core 契约的一部分，无需额外产物）
                plain: configurable('默认 input 字段', {
                    label: '普通输入',
                }),
            });
            const form = document.getElementById('form');
            form.state = store.state;
            window.formviewer = (operate) => {
                document.getElementById('viewer').innerHTML = JSON.stringify(store.snapshot(false), null, 2);
            };
            store.watch('**', (operate) => {
                if (operate.reply) return;
                window.formviewer(operate);
            });
            window.formviewer();
        </script>
    </body>
</html>
