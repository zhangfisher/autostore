<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/vite.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>AutoStore</title>
        <link rel="stylesheet" href="/autostore/autoform.dark.css" />
        <link rel="stylesheet" href="/autostore/autoform.light.css" />
        <script src="/autostore/autoform.js"></script>
    </head>

    <body style="overflow: hidden; padding: 1em 0px">
        <div style="display: flex; flex-direction: column; postion: relative">
            <auto-form id="form" labelpos="left"></auto-form>
            <div id="viewer" style="padding: 1em; border: 1px solid #ccc; margin-top: 1em"></div>
        </div>
        <script>
            const { configurable } = AutoForm;
            const form = document.getElementById('form');
            form.state = {
                basic: configurable('', {
                    label: '执行周期',
                    widget: 'cron',
                    placeholder: '请选择执行周期',
                }),
                withSeconds: configurable('', {
                    label: '含秒周期',
                    widget: 'cron',
                    enableSeconds: true,
                }),
                withDefault: configurable('', {
                    label: '默认周期',
                    widget: 'cron',
                    defaultCron: '0 8 1 * * 2027',
                }),
                custom: configurable('', {
                    label: '自定义',
                    widget: 'cron',
                    yearRange: [2026, 2030],
                    stepOptions: { minute: [1, 5, 15, 30] },
                    panelMinWidth: 680,
                }),
                readonlyCron: configurable('0 8 1 * * 2027', {
                    label: '只读',
                    widget: 'cron',
                    readOnly: true,
                }),
            };
            form.updateComplete.then(() => {
                const store = form.activeStore;
                window.formviewer = (operate) => {
                    document.getElementById('viewer').innerHTML = JSON.stringify(
                        store.getSnap({ reserveAsync: false }),
                        null,
                        2,
                    );
                };
                store.watch('**', (operate) => {
                    if (operate.reply) return;
                    window.formviewer(operate);
                });
                window.formviewer();
            });
</script>
    </body>
</html>
