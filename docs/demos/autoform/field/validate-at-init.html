<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/vite.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>AutoStore</title>
        <link rel="stylesheet" href="/autostore/autoform.dark.css" />
        <link rel="stylesheet" href="/autostore/autoform.light.css" />
        <script src="/autostore/autoform.js"></script>
    </head>

    <body style="overflow: hidden">
        <div style="display: flex; gap: 2em">
            <auto-form id="formInit" valid-at-init></auto-form>
            <auto-form id="formDefault"></auto-form>
        </div>

        <script>
            const { configurable } = AutoForm;

            // 两个表单的初始值均不满足校验规则
            const formInit = document.querySelector('#formInit');
            formInit.state = {
                username: configurable('abc', {
                    label: '用户名',
                    help: 'valid-at-init: 首次渲染即显示错误',
                    validate: (value) => value.length >= 6,
                    errorMessage: '用户名长度必须大于等于6',
                }),
            };

            const formDefault = document.querySelector('#formDefault');
            formDefault.state = {
                username: configurable('abc', {
                    label: '用户名',
                    help: '默认: 交互后才显示错误',
                    validate: (value) => value.length >= 6,
                    errorMessage: '用户名长度必须大于等于6',
                }),
            };
        </script>
    </body>
</html>
