<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/vite.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>AutoStore</title>
        <link rel="stylesheet" href="/autostore/autoform.dark.css" />
        <link rel="stylesheet" href="/autostore/autoform.light.css" />
        <script src="/autostore/autoform.js"></script>
    </head>

    <body style="overflow: hidden">
        <div style="display: flex">
            <auto-form id="form" valid-at="input"></auto-form>
        </div>

        <script>
            const { configurable } = AutoForm;
            const form = document.querySelector('#form');
            form.state = {
                // 1. 静态错误信息
                username: configurable('', {
                    label: '用户名',
                    help: '静态字符串',
                    validate: (value) => value.length >= 6,
                    errorMessage: '用户名长度必须大于等于6',
                }),
                // 2. 从校验函数抛出的错误中提取信息
                password: configurable('', {
                    label: '密码',
                    help: '未指定 errorMessage 时显示 throw 出来的信息',
                    validate: (value) => {
                        if (value.length < 6) {
                            throw new Error('密码至少需要6位');
                        }
                        return true;
                    },
                }),
                // 3. 插值变量：{label}、{value}、{error} 及任意自定义配置项
                nickname: configurable('', {
                    label: '昵称',
                    help: '插值变量：{label} {min} {max} {value}',
                    min: 2,
                    max: 5,
                    validate: (value) => value.length >= 2 && value.length <= 5,
                    errorMessage: '{label}长度必须在{min}-{max}之间，当前"{value}"不合法',
                }),
            };
        </script>
    </body>
</html>
