<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>x-component · 组件基础</title>
        <script src="/autostore/template.js"></script>
        <link rel="stylesheet" href="/autostore/bulma.min.css" />
    </head>
    <body>
        <!--
            x-scope 让纯容器建 scope，使内部 x-component 有归属锚点。
            组件 counter 声明了 data/methods/生命周期，x-use 实例化它。
        -->
        <div id="app" x-scope>
            <!-- 组件声明（编译后从 DOM 消失，仅作供体） -->
            <div x-component="counter">
                <div class="counter-box">
                    <button class="button is-small" x-on:click="dec">-</button>
                    <span class="count" x-text="count"></span>
                    <button class="button is-small is-primary" x-on:click="inc">+</button>
                </div>
                <script setup>
                    {
                        data() {
                            return { count: 0 };
                        },
                        methods: {
                            inc() {
                                this.data.count++;
                            },
                            dec() {
                                this.data.count--;
                            },
                        },
                        mounted() {
                            this.data.count = 5;
                        },
                    }
                </script>
                <style>
                    .counter-box {
                        display: inline-flex;
                        align-items: center;
                        gap: 8px;
                        padding: 8px 12px;
                        border: 1px solid #dbdbdb;
                        border-radius: 6px;
                    }
                    .count {
                        min-width: 32px;
                        text-align: center;
                        font-weight: bold;
                        font-size: 1.2em;
                    }
                </style>
            </div>

            <!-- 实例化组件（mounted 钩子把 count 初始化为 5） -->
            <div class="panel">
                <div x-use="counter"></div>
            </div>

            <!-- 传 props：count 覆盖 data() 默认（这里 mounted 后仍为 5，props 仅在 data() 阶段覆盖） -->
            <div class="panel">
                <div x-use="{ name: 'counter' }"></div>
            </div>
        </div>

        <script>
            const { AutoTemplateEngine } = AutoTemplateSpaces;
            const engine = new AutoTemplateEngine(document.getElementById("app"), {});
        </script>
    </body>
</html>
