<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>x-component · 组件上下文 this</title>
        <script src="/autostore/template.js"></script>
        <link rel="stylesheet" href="/autostore/bulma.min.css" />
    </head>
    <body>
        <!--
            组件 methods / 生命周期钩子内 this 的三件套：
            - this.data   组件聚合数据视图（data() 返回 + x-use props），响应式、可读可写
            - this.state  全局 store 状态（engine.store.state）
            - this.scope  当前组件实例 scope（this.scope.el 即组件根元素）
            本 demo：组件读取全局 state.user.name 与自身 data.greeting 拼接问候语。
        -->
        <div id="app" x-scope>
            <div x-component="hello">
                <div class="hello" x-text="message"></div>
                <script setup>
                    {
                        data() {
                            return { greeting: "你好" };
                        },
                        created() {
                            // created：scope 创建 + data 注入后、编译前
                            // 读全局 state.user.name 与自身 data.greeting 拼接
                            const name = this.state.user.name;
                            this.data.message = `${this.data.greeting}，${name}！`;
                        },
                        mounted() {
                            // mounted：DOM 子树编译完成，this.scope.el 即组件根
                            this.scope.el.setAttribute("title", "由组件上下文生成");
                        },
                    }
                </script>
                <style>
                    .hello {
                        padding: 12px 16px;
                        background: #f0fdf4;
                        border-left: 3px solid #23d160;
                        border-radius: 4px;
                        font-size: 1.1rem;
                    }
                </style>
            </div>

            <div class="panel">
                <div class="label">组件读取全局 state + 自身 data（created 拼接）</div>
                <div x-use="hello"></div>
            </div>

            <div class="panel">
                <div class="label">改全局用户名 → 组件内 created 不会重跑（仅实例化时执行一次）</div>
                <button class="button is-small is-primary" @click="rename">改全局用户名</button>
            </div>
        </div>

        <script>
            const { AutoTemplateEngine } = AutoTemplateSpaces;
            const engine = new AutoTemplateEngine(
                document.getElementById("app"),
                { user: { name: "张三" } },
                {
                    actions: {
                        rename() {
                            engine.state.user.name = "李四";
                        },
                    },
                },
            );
        </script>

        <style>
            .panel {
                padding: 16px;
                border: 1px solid #dbdbdb;
                border-radius: 8px;
                margin-bottom: 12px;
            }
            .label {
                font-size: 0.8rem;
                color: #888;
                margin-bottom: 8px;
            }
        </style>
    </body>
</html>
