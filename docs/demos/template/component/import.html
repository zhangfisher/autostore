<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>x-component · 远程加载（作用域）</title>
        <script src="/autostore/template.js"></script>
        <link rel="stylesheet" href="/autostore/bulma.min.css" />
    </head>
    <body>
        <!--
            x-import 从远程 url 加载组件定义（fetched HTML 内可含 1-N 个 x-component）：
            - 默认（无修饰符）：注册为作用域组件，挂最近祖先 scope，仅本作用域可见；
            - 组件未就绪时 x-use 显示 loading 占位，加载完成后自动重实例化（异步占位 R6=B）；
            - url 缓存：重复 import 同一 url 只 fetch 一次；
            - 循环 import 检测；fetch 失败 warn 不崩溃。
            组件文件见 /autostore/components/like-button.html（含 data/methods/scoped style）。
        -->
        <div id="app" x-scope>
            <!-- 加载远程组件：作用域注册，仅本 x-scope 子树可见 -->
            <div x-import="/autostore/components/like-button.html"></div>

            <!-- 实例化：组件加载完成前 x-use 显示 loading 占位，就绪后自动渲染 -->
            <div class="panel">
                <div class="label">远程作用域组件 like-button（加载完成后可点击）</div>
                <div x-use="like-button"></div>
            </div>
        </div>

        <script>
            const { AutoTemplateEngine } = AutoTemplateSpaces;
            const engine = new AutoTemplateEngine(document.getElementById("app"), {});
        </script>

        <style>
            .panel {
                padding: 16px;
                border: 1px solid #dbdbdb;
                border-radius: 8px;
                margin-bottom: 12px;
            }
            .label {
                font-size: 0.8rem;
                color: #888;
                margin-bottom: 8px;
            }
        </style>
    </body>
</html>
