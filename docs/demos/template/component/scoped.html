<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>x-component · 就近覆盖（局部特例遮蔽全局）</title>
        <script src="/autostore/template.js"></script>
        <link rel="stylesheet" href="/autostore/bulma.min.css" />
    </head>
    <body>
        <!--
            组件查找「沿 parent 链就近 + 全局兜底」：
            - 全局组件 badge（蓝底）在 options.components 声明，全引擎兜底；
            - 内层 x-scope 声明一个同名局部 badge（绿底），仅该子树可见。
            因 getComponent 沿 parent 链向上查找（ADR-0022 决策五），查找顺序是：
              本 scope.components → 各祖先 scope.components → 全局兜底。
            故：
              - 外层 x-use（无局部 badge，链上无祖先局部）→ 兜底全局（蓝）；
              - 内层 x-use（自身 scope 有局部 badge）→ 命中局部（绿），就近遮蔽全局。
            注意：就近链是「向上穿透」的——只要祖先 scope 声明了同名局部组件，
            后代就能取到（非「独立作用域」）。本 demo把局部声明放内层，演示「局部特例」。
        -->
        <div id="app" x-scope>
            <!-- 外层：无局部 badge → getComponent 沿链无祖先局部 → 兜底全局（蓝） -->
            <div class="panel">
                <div class="label">外层（无局部 badge）：兜底全局 → 蓝</div>
                <div x-use="badge"></div>
            </div>

            <!-- 内层 x-scope：声明局部 badge（绿），仅本子树就近可见、遮蔽全局 -->
            <div class="panel inner" x-scope>
                <div x-component="badge">
                    <span class="badge local">局部绿标</span>
                </div>
                <div class="label">内层（声明局部 badge）：就近命中局部 → 绿</div>
                <div x-use="badge"></div>
            </div>
        </div>

        <script>
            const { AutoTemplateEngine } = AutoTemplateSpaces;
            const engine = new AutoTemplateEngine(document.getElementById("app"), {}, {
                components: {
                    // 全局组件（蓝底）：字符串入参，自动包装打 x-component="badge"
                    badge: `<span class="badge global">全局蓝标</span>`,
                },
            });
        </script>

        <style>
            .panel {
                padding: 16px;
                border: 1px solid #dbdbdb;
                border-radius: 8px;
                margin-bottom: 12px;
            }
            .label {
                font-size: 0.8rem;
                color: #888;
                margin-bottom: 8px;
            }
            .badge {
                display: inline-block;
                padding: 4px 12px;
                border-radius: 999px;
                color: #fff;
                font-size: 0.85rem;
                font-weight: 600;
            }
            .badge.local {
                background: #23d160;
            }
            .badge.global {
                background: #3273dc;
            }
        </style>
    </body>
</html>
