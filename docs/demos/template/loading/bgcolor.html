<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>x-loading · bgColor 遮罩底色</title>
        <script src="/autostore/template.js"></script>
        <link rel="stylesheet" href="/autostore/template.css" />
        <style>
            .panel {
                position: relative;
                min-height: 110px;
                display: flex;
                align-items: center;
                justify-content: center;
                flex: 1;
            }
        </style>
    </head>

    <body>
        <!-- bgColor：覆盖层背景色（与 opacity 合成为 rgba），默认 'black' -->
        <div class="demo-app">
            <p>
                <button class="btn" @click="toggle">{{ on ? '隐藏' : '显示' }}覆盖层</button>
            </p>
            <div class="row">
                <div class="card panel" x-loading="{ visible:'on', bgColor:'black' }">
                    <code>bgColor:'black'</code>（默认）
                </div>
                <div class="card panel" x-loading="{ visible:'on', bgColor:'white' }">
                    <code>bgColor:'white'</code>
                </div>
                <div class="card panel" x-loading="{ visible:'on', bgColor:'#42b883' }">
                    <code>bgColor:'#42b883'</code>
                </div>
            </div>
            <p class="muted">bgColor 经 alpha 合成为 <code>rgba(bgColor, opacity)</code>，故实际底色透明度由 <code>opacity</code> 控制。</p>
        </div>

        <script>
            const { AutoTemplateEngine } = AutoTemplateSpaces;
            const engine = new AutoTemplateEngine(
                document.querySelector(".demo-app"),
                { on: true },
                {
                    actions: {
                        toggle: () => {
                            engine.state.on = !engine.state.on;
                        },
                    },
                },
            );
        </script>
    </body>
</html>
