<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>x-loading · bgColor 遮罩底色</title>
        <script src="/autostore/template.js"></script>
        <link rel="stylesheet" href="/autostore/bulma.min.css" />
        <style>
            .panel {
                position: relative;
                min-height: 110px;
                display: flex;
                align-items: center;
                justify-content: center;
                flex: 1;
            }
        </style>
    </head>

    <body>
        <!-- bgColor：覆盖层背景色（与 opacity 合成为 rgba），默认 'black' -->
        <div class="demo-app section">
            <div class="buttons">
                <button class="button is-primary" @click="toggle">{{ on ? '隐藏' : '显示' }}覆盖层</button>
            </div>
            <div class="columns">
                <div class="card panel column" x-loading="{ visible:'on', bgColor:'black' }">
                    <div class="card-content"><code>bgColor:'black'</code>（默认）</div>
                </div>
                <div class="card panel column" x-loading="{ visible:'on', bgColor:'white' }">
                    <div class="card-content"><code>bgColor:'white'</code></div>
                </div>
                <div class="card panel column" x-loading="{ visible:'on', bgColor:'#42b883' }">
                    <div class="card-content"><code>bgColor:'#42b883'</code></div>
                </div>
            </div>
            <div class="block has-text-grey">bgColor 经 alpha 合成为 <code>rgba(bgColor, opacity)</code>，故实际底色透明度由 <code>opacity</code> 控制。</div>
        </div>

        <script>
            const { AutoTemplateEngine } = AutoTemplateSpaces;
            const engine = new AutoTemplateEngine(
                document.querySelector(".demo-app"),
                { on: true },
                {
                    actions: {
                        toggle: () => {
                            engine.state.on = !engine.state.on;
                        },
                    },
                },
            );
        </script>
    </body>
</html>
