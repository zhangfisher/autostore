<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>x-loading · color loader 旋转色</title>
        <script src="/autostore/template.js"></script>
        <link rel="stylesheet" href="/autostore/template.css" />
        <style>
            .panel {
                position: relative;
                min-height: 110px;
                display: flex;
                align-items: center;
                justify-content: center;
                flex: 1;
            }
        </style>
    </head>

    <body>
        <!-- color：loader 旋转色（经 currentColor 注入），支持 hex / rgb / 颜色名 -->
        <div class="demo-app">
            <p>
                <button class="btn" @click="toggle">{{ on ? '隐藏' : '显示' }} loader</button>
            </p>
            <div class="row">
                <div class="card panel" x-loading="{ visible:'on', color:'#42b883' }">
                    <code>color:'#42b883'</code>
                </div>
                <div class="card panel" x-loading="{ visible:'on', color:'#e07000' }">
                    <code>color:'#e07000'</code>
                </div>
                <div class="card panel" x-loading="{ visible:'on', color:'#3b82f6' }">
                    <code>color:'#3b82f6'</code>
                </div>
                <div class="card panel" x-loading="{ visible:'on', color:'red' }">
                    <code>color:'red'</code>
                </div>
            </div>
            <p class="muted">默认 <code>color:'#888'</code>（灰色）。颜色解析支持 hex、rgb()/rgba()、hsl()/hsla() 及常用颜色名。</p>
        </div>

        <script>
            const { AutoTemplateEngine } = AutoTemplateSpaces;
            const engine = new AutoTemplateEngine(
                document.querySelector(".demo-app"),
                { on: true },
                {
                    actions: {
                        toggle: () => {
                            engine.state.on = !engine.state.on;
                        },
                    },
                },
            );
        </script>
    </body>
</html>
