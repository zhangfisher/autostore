<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>x-loading · selector 挂载目标</title>
        <script src="/autostore/template.js"></script>
        <link rel="stylesheet" href="/autostore/template.css" />
        <style>
            /* 目标元素需 position:relative，覆盖层才相对它定位 */
            .target {
                position: relative;
                min-height: 80px;
                display: flex;
                align-items: center;
                background: #f8f9fa;
                border: 1px dashed #bbb;
                border-radius: 6px;
                padding: 12px;
                margin-top: 8px;
            }
        </style>
    </head>

    <body>
        <!-- selector：覆盖层挂载目标。普通值→宿主后代；@前缀→document 全局元素 -->
        <div class="demo-app">
            <p>
                <button class="btn" @click="onA">在宿主后代 <code>#inner</code> 上显示</button>
            </p>
            <!-- 宿主带 x-loading，但 selector 让覆盖层挂到宿主后代的 #inner -->
            <div class="card" x-loading="{ visible:'a', selector:'#inner' }">
                <span>宿主元素（带 <code>x-loading</code>，但覆盖层不挂这里）</span>
                <div id="inner" class="target">覆盖层挂到这里（宿主后代，<code>selector:'#inner'</code>）</div>
            </div>

            <hr />
            <p>
                <button class="btn" @click="onB">在宿主外全局 <code>#outside</code> 上显示</button>
            </p>
            <!-- 全局目标：与下面的宿主同级，宿主的覆盖层却挂到这个外部元素 -->
            <div id="outside" class="target">全局目标（与宿主同级，<code>selector:'@#outside'</code>）</div>
            <div class="card" x-loading="{ visible:'b', selector:'@#outside' }" style="margin-top:8px">
                宿主元素（带 <code>x-loading</code>，覆盖层却挂到上面的全局 <code>#outside</code>）。
            </div>
            <p class="muted">@ 前缀走 <code>document.querySelector</code>，可把覆盖层挂到宿主之外/全局元素；未命中或非法选择器回退宿主。</p>
        </div>

        <script>
            const { AutoTemplateEngine } = AutoTemplateSpaces;
            const engine = new AutoTemplateEngine(
                document.querySelector(".demo-app"),
                { a: false, b: false },
                {
                    actions: {
                        onA: () => {
                            engine.state.a = !engine.state.a;
                        },
                        onB: () => {
                            engine.state.b = !engine.state.b;
                        },
                    },
                },
            );
        </script>
    </body>
</html>
