<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>x-component · 就近覆盖与全局兜底</title>
        <script src="/autostore/template.js"></script>
        <link rel="stylesheet" href="/autostore/bulma.min.css" />
        <style>
            .panel {
                position: relative;
                min-height: 100px;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            /* 全局 loading 块：旋转环 */
            .global-spin {
                width: 28px;
                height: 28px;
                border: 3px solid rgba(255, 255, 255, 0.35);
                border-top-color: #fff;
                border-radius: 50%;
                animation: global-rot 0.8s infinite linear;
            }
            @keyframes global-rot {
                to {
                    transform: rotate(360deg);
                }
            }
            /* 局部 loading 块：跳动点 */
            .local-dots {
                display: flex;
                gap: 6px;
            }
            .local-dots span {
                width: 9px;
                height: 9px;
                border-radius: 50%;
                background: #fff;
                animation: local-bounce 1s infinite ease-in-out;
            }
            .local-dots span:nth-child(2) {
                animation-delay: 0.15s;
            }
            .local-dots span:nth-child(3) {
                animation-delay: 0.3s;
            }
            @keyframes local-bounce {
                0%,
                80%,
                100% {
                    transform: scale(0.5);
                    opacity: 0.4;
                }
                40% {
                    transform: scale(1);
                    opacity: 1;
                }
            }
            .tag-line {
                color: #fff;
                font-size: 12px;
                opacity: 0.85;
            }
        </style>
    </head>

    <body>
        <!-- 块查找的就近覆盖 + 全局兜底：
             全局 blocks.loading = 旋转环（字符串模板，全引擎默认复用）；
             外层 x-scope 再声明一个局部 loading 块 = 跳动点，就近遮蔽全局。
             两个宿主分属不同 scope，演示同一种 UI 态的多形态复用。 -->
        <div class="demo-app section">
            <div class="buttons">
                <button class="button is-primary" @click="toggle">{{ on ? '隐藏' : '显示' }}加载态</button>
            </div>

            <div class="columns">
                <!-- ① 外层 x-scope 有局部 loading 块（跳动点）→ 就近覆盖全局 -->
                <div x-scope class="column">
                    <div x-component="loading">
                        <div class="local-dots"><span></span><span></span><span></span></div>
                        <div class="tag-line">局部块（跳动点）</div>
                    </div>
                    <div class="card panel" x-loading="{ visible:'on' }"><div class="card-content">局部块覆盖</div></div>
                </div>

                <!-- ② 此 scope 无局部 loading 块 → 沿链无命中 → 兜底全局块（旋转环） -->
                <div x-scope class="column">
                    <div class="card panel" x-loading="{ visible:'on' }"><div class="card-content">全局块兜底</div></div>
                </div>
            </div>

            <div class="block has-text-grey">
                左卡片经 <code>getBlock("loading")</code> 沿 scope 链就近命中局部块；右卡片链上无局部块，到顶后兜底命中 <code>options.blocks.loading</code> 全局块。
            </div>
        </div>

        <script>
            const { AutoTemplateEngine } = AutoTemplateSpaces;
            const engine = new AutoTemplateEngine(
                document.querySelector(".demo-app"),
                { on: true },
                {
                    // 全局 loading 块：字符串入参，首次使用时自动包装成块、全引擎复用
                    blocks: {
                        loading: `<div class="global-spin"></div><div class="tag-line">全局块（旋转环）</div>`,
                    },
                    actions: {
                        toggle: () => {
                            engine.state.on = !engine.state.on;
                        },
                    },
                },
            );
        </script>
    </body>
</html>
