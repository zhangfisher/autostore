<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>x-data · 私有响应式域</title>
        <script src="/autostore/template.js"></script>
        <link rel="stylesheet" href="/autostore/bulma.min.css" />
    </head>

    <body>
        <!-- x-data 默认模式：私有响应式域，子树可见、字段级更新 -->
        <div class="demo-app section" x-data="{ msg: '你好', times: 1 }">
            <div class="block">{{ msg }}（第 {{ times }} 次）</div>
            <div class="buttons">
                <button class="button is-primary" @click="bump">+1</button>
            </div>
        </div>

        <script>
            const { AutoTemplateEngine } = AutoTemplateSpaces;
            const engine = new AutoTemplateEngine(
                document.querySelector(".demo-app"),
                {},
                {
                    actions: {
                        // this.data 是 AutoTemplateActionContext 的聚合视图；写 times 经 set 陷阱透传到
                        // 本层私有响应式域（store.state._scopes[id].times），触发细粒度更新。
                        bump: function () {
                            this.data.times = this.data.times + 1;
                        },
                    },
                },
            );
        </script>
    </body>
</html>
