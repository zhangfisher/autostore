<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>快速入门</title>
        <script src="/autostore/template.js"></script>
        <link rel="stylesheet" href="/autostore/bulma.min.css" />
    </head>

    <body>
        <!-- 一个最小而完整的模板：x-text 文本绑定 + {{}} 插值 + @click 事件 -->
        <div class="demo-app section">
            <div class="block">你好，<span class="has-text-primary has-text-weight-semibold" x-text="user.name"></span>！</div>
            <div class="block">商品：{{ order.name }}，单价 {{ order.price }} 元</div>
            <div class="block">合计：<strong class="has-text-primary has-text-weight-semibold" x-text="order.price * order.count"></strong> 元</div>
            <div class="buttons">
                <button class="button is-primary" @click="rename">改名 + 加购</button>
            </div>
        </div>

        <script>
            const { AutoTemplateEngine } = AutoTemplateSpaces;
            // 第二参传裸状态，引擎自动建立 store
            const engine = new AutoTemplateEngine(
                document.querySelector(".demo-app"),
                {
                    user: { name: "张三" },
                    order: { name: "AutoStore 手册", price: 18, count: 3 },
                },
                {
                    actions: {
                        rename: () => {
                            engine.state.user.name = "李四";
                            engine.state.order.count += 1;
                        },
                    },
                },
            );
        </script>
    </body>
</html>
