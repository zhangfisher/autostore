<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>x-text · 文本插值</title>
        <script src="/autostore/template.js"></script>
        <link rel="stylesheet" href="/autostore/bulma.min.css" />
    </head>

    <body>
        <!-- 文本节点中用 {{ }} 插值：路径、表达式、多段混排，效果与 x-text 等价 -->
        <div class="demo-app section">
            <div class="block">商品：{{ order.name }}，单价 <span class="has-text-primary has-text-weight-semibold">{{ order.price }}</span> 元</div>
            <div class="block">合计：<span class="has-text-primary has-text-weight-semibold">{{ order.price * order.count }}</span> 元（共 {{ order.count }} 件）</div>
            <div class="buttons">
                <button class="button is-primary" @click="add">加购一件</button>
                <button class="button is-primary" @click="raise">增加价格</button>
            </div>
        </div>

        <script>
            const { AutoTemplateEngine } = AutoTemplateSpaces;
            const engine = new AutoTemplateEngine(
                document.querySelector(".demo-app"),
                { order: { name: "AutoStore 手册", price: 18, count: 3 } },
                {
                    actions: {
                        add: () => {
                            engine.state.order.count++;
                        },
                        raise: () => {
                            engine.state.order.price++;
                        },
                    },
                },
            );
        </script>
    </body>
</html>
