<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>x-text · 绑定状态路径</title>
        <script src="/autostore/template.js"></script>
        <link rel="stylesheet" href="/autostore/bulma.min.css" />
    </head>

    <body>
        <!-- x-text 的值是一个状态路径，引擎订阅该路径 -->
        <div class="demo-app section">
            <div class="block">姓名：<span class="has-text-primary has-text-weight-semibold" x-text="user.name"></span></div>
            <div class="block">城市：<span class="has-text-primary has-text-weight-semibold" x-text="user.address.city"></span></div>
            <div class="block">邮编：<span class="has-text-primary has-text-weight-semibold" x-text="user.address.zip"></span></div>
        </div>

        <script>
            const { AutoTemplateEngine } = AutoTemplateSpaces;
            new AutoTemplateEngine(document.querySelector(".demo-app"), {
                user: { name: "张三", address: { city: "杭州", zip: "310000" } },
            });
        </script>
    </body>
</html>
