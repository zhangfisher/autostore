<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>动作 · feedback 修饰符</title>
        <script src="/autostore/template.js"></script>
        <link rel="stylesheet" href="/autostore/bulma.min.css" />
        <style>
            /* .feedback 默认反馈类：pending 时加载态、resolved 时成功态（作用在 Bulma .button 上） */
            .button.pending {
                background: #999;
                opacity: 0.7;
            }
            .button.resolved {
                background: #2c8c5e;
                box-shadow: 0 0 0 2px #aee9d5;
            }
        </style>
    </head>

    <body>
        <!-- .feedback：动作 pending/resolved 时自动切换触发元素类，声明式执行反馈 -->
        <div class="demo-app section">
            <div class="block">状态：<span class="has-text-primary has-text-weight-semibold" x-text="status"></span></div>
            <div class="buttons">
                <button class="button is-primary" @click.feedback="save">保存（.feedback）</button>
            </div>
        </div>

        <script>
            const { AutoTemplateEngine } = AutoTemplateSpaces;
            const engine = new AutoTemplateEngine(
                document.querySelector(".demo-app"),
                { status: "空闲" },
                {
                    actions: {
                        save: async function () {
                            this.engine.state.status = "保存中...";
                            await new Promise((r) => setTimeout(r, 800));
                            this.engine.state.status = "已保存";
                        },
                    },
                },
            );
        </script>
    </body>
</html>
