<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>x-for · 基础列表</title>
        <script src="/autostore/template.js"></script>
        <link rel="stylesheet" href="/autostore/bulma.min.css" />
    </head>

    <body>
        <!-- ul 是容器，li 是项模板；:key 在容器上声明 -->
        <div class="demo-app section">
            <div class="block">书单（{{ books.length }} 本）：</div>
            <div class="content">
                <ul x-for="book of books" :key="book.id">
                    <li>
                        #{{ book.id }}
                        <strong class="has-text-primary has-text-weight-semibold">{{ book.title }}</strong>
                        — {{ book.author }}
                    </li>
                </ul>
            </div>
            <div class="buttons">
                <button class="button is-primary" @click="add">末尾添加</button>
                <button class="button is-primary" @click="removeFirst">移除首项</button>
            </div>
        </div>

        <script>
            const { AutoTemplateEngine } = AutoTemplateSpaces;
            let nextId = 3;
            const engine = new AutoTemplateEngine(
                document.querySelector(".demo-app"),
                {
                    books: [
                        { id: 1, title: "AutoStore", author: "wxz" },
                        { id: 2, title: "FlexState", author: "wxz" },
                    ],
                },
                {
                    actions: {
                        add: () => {
                            engine.state.books.push({
                                id: nextId++,
                                title: "新书 " + nextId,
                                author: "新作者",
                            });
                        },
                        removeFirst: () => {
                            engine.state.books.shift();
                        },
                    },
                },
            );
        </script>
    </body>
</html>
