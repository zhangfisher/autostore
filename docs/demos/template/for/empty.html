<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>x-for · x-empty 空状态</title>
        <script src="/autostore/template.js"></script>
        <link rel="stylesheet" href="/autostore/bulma.min.css" />
    </head>

    <body>
        <!-- x-empty 子节点在数组为空时渲染一次 -->
        <div class="demo-app section">
            <div class="content">
                <ul x-for="item of items">
                    <li>{{ item }}</li>
                    <li x-empty class="has-text-grey">（列表为空，没有数据）</li>
                </ul>
            </div>
            <div class="buttons">
                <button class="button is-primary" @click="toggle">切换 空 / 有值</button>
            </div>
        </div>

        <script>
            const { AutoTemplateEngine } = AutoTemplateSpaces;
            const engine = new AutoTemplateEngine(
                document.querySelector(".demo-app"),
                { items: ["甲", "乙"] },
                {
                    actions: {
                        toggle: () => {
                            engine.state.items = engine.state.items.length ? [] : ["甲", "乙"];
                        },
                    },
                },
            );
        </script>
    </body>
</html>
