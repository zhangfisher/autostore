<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>x-if.keepalive（摘宿主但保活子树与 watcher）</title>
        <script src="/autostore/template.js"></script>
        <link rel="stylesheet" href="/autostore/bulma.min.css" />
    </head>

    <body>
        <!-- keepalive 模式（x-if.keepalive）：假时宿主 detach（离开 DOM、锚点注释占位），
             不被 querySelector 命中、不被表单提交；但子树 DOM 与 watcher 全保留——
             挂回时是同一个元素实例，隐藏期间累积的变更照常生效 -->
        <div class="demo-app section">
            <div class="buttons">
                <button class="button is-primary" @click="toggle">{{ on ? "摘除" : "挂回" }}面板</button>
                <button class="button is-primary" @click="check">querySelector 命中？</button>
            </div>
            <div class="block has-text-grey">检查结果：{{ report }}</div>

            <div class="field">
                <label class="label">改 draft（面板摘除时改也行，watcher 仍存活）：</label>
                <div class="control">
                    <input class="input" @input="onInput($event)" :value="draft" />
                </div>
            </div>

            <div x-if.keepalive="on">
                <div class="card">
                    <div class="card-content">
                        keepalive 模式：假时宿主 <strong>离开 DOM</strong>（detach，锚点注释占位），不被
                        <code>querySelector</code> 命中、不被表单提交；但子树 DOM 与 watcher <strong>全保留</strong>
                        ——挂回时是<strong>同一个</strong>元素实例，隐藏期间对 draft 的变更照常反映。
                    </div>
                </div>
                <div class="field">
                    <label class="label">面板内 input（:value="draft"，跟随上方）：</label>
                    <div class="control">
                        <input id="ka-input" class="input" :value="draft" readonly />
                    </div>
                </div>
            </div>
        </div>

        <script>
            const { AutoTemplateEngine } = AutoTemplateSpaces;
            const engine = new AutoTemplateEngine(
                document.querySelector(".demo-app"),
                { on: true, draft: "hello", report: "（点上方按钮检查）" },
                {
                    actions: {
                        toggle: () => {
                            engine.state.on = !engine.state.on;
                        },
                        onInput: ($event) => {
                            engine.state.draft = $event.target.value;
                        },
                        check: () => {
                            engine.state.report = document.querySelector("#ka-input")
                                ? "✅ 命中（面板在 DOM）"
                                : "❌ 未命中（面板已 detach，锚点注释占位）";
                        },
                    },
                },
            );
        </script>
    </body>
</html>
