<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>x-if.keep / x-show</title>
        <script src="/autostore/template.js"></script>
        <link rel="stylesheet" href="/autostore/template.css" />
    </head>

    <body>
        <!-- keep 模式（x-show）：仅切 display，子树与 watcher 全保留 -->
        <div class="demo-app">
            <button class="btn" @click="toggle">切换显示</button>
            <div x-show="on">
                <p class="card">
                    keep 模式：隐藏时只是 <code>display:none</code>，子树 DOM 与 watcher 都保留。
                </p>
                <p>
                    输入框值保留：
                    <input class="input" @input="onInput($event)" :value="draft" />
                    <span class="muted">（{{ draft }}）</span>
                </p>
            </div>
        </div>

        <script>
            const { AutoTemplateEngine } = AutoTemplateSpaces;
            const engine = new AutoTemplateEngine(
                document.querySelector(".demo-app"),
                { on: true, draft: "" },
                {
                    actions: {
                        toggle: () => {
                            engine.state.on = !engine.state.on;
                        },
                        onInput: ($event) => {
                            engine.state.draft = $event.target.value;
                        },
                    },
                },
            );
        </script>
    </body>
</html>
