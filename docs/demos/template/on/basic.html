<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>x-on · 事件与修饰符</title>
        <script src="/autostore/template.js"></script>
        <link rel="stylesheet" href="/autostore/bulma.min.css" />
    </head>

    <body>
        <!-- @click / .once / .ctrl / @keydown.enter -->
        <div class="demo-app section">
            <div class="block">计数：<strong class="has-text-primary has-text-weight-semibold">{{ count }}</strong></div>
            <div class="buttons">
                <button class="button is-primary" @click="inc">+1</button>
                <button class="button is-primary" @click.once="onceFn">.once（仅一次）</button>
                <button class="button is-primary" @click.ctrl="ctrlClick">.ctrl（需 Ctrl+点击）</button>
            </div>
            <div class="field">
                <label class="label">回车提交：</label>
                <div class="control">
                    <input class="input" @keydown.enter="onEnter($event)" placeholder="输入后按回车" />
                </div>
            </div>
            <div class="block has-text-grey">{{ log }}</div>
        </div>

        <script>
            const { AutoTemplateEngine } = AutoTemplateSpaces;
            const engine = new AutoTemplateEngine(
                document.querySelector(".demo-app"),
                { count: 0, log: "" },
                {
                    actions: {
                        inc: () => {
                            engine.state.count++;
                            engine.state.log = "inc +1";
                        },
                        onceFn: () => {
                            engine.state.log = "once 触发（再点无效）";
                        },
                        ctrlClick: () => {
                            engine.state.log = "Ctrl+点击命中";
                        },
                        onEnter: ($event) => {
                            engine.state.log = "回车提交：" + $event.target.value;
                        },
                    },
                },
            );
        </script>
    </body>
</html>
