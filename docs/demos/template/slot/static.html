<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>x-slot · static 冻结快照</title>
        <script src="/autostore/template.js"></script>
        <link rel="stylesheet" href="/autostore/template.css" />
    </head>

    <body>
        <!-- static：x-slot 内指令被剥、不编译；改名只影响普通区域 -->
        <div class="demo-app">
            <div class="card" x-slot>
                <p>静态快照（engine 永不覆写）：</p>
                <span x-text="name">（我是初始文本）</span>
            </div>
            <p>普通区域：<span class="val" x-text="name"></span></p>
            <button class="btn" @click="swap">改名（只影响普通区域）</button>
        </div>

        <script>
            const { AutoTemplateEngine } = AutoTemplateSpaces;
            const engine = new AutoTemplateEngine(
                document.querySelector(".demo-app"),
                { name: "张三" },
                {
                    actions: {
                        swap: () => {
                            engine.state.name = engine.state.name === "张三" ? "李四" : "张三";
                        },
                    },
                },
            );
        </script>
    </body>
</html>
