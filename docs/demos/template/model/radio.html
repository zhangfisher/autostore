<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>x-model · radio 单值选择</title>
        <script src="/autostore/template.js"></script>
        <link rel="stylesheet" href="/autostore/bulma.min.css" />
        <style>
            .radio-group { display: flex; gap: 1.5rem; flex-wrap: wrap; }
            .radio-group label { display: flex; align-items: center; gap: 0.3rem; cursor: pointer; }
            .result { background: #f5f5f5; padding: 0.75rem; border-radius: 6px; font-family: monospace; font-size: 0.9rem; margin-top: 1rem; white-space: pre-wrap; }
        </style>
    </head>

    <body>
        <!-- radio 单值选择：el.checked = (state === el.value)，勾选时 state = el.value -->
        <div class="demo-app section">
            <h3 class="title is-5">radio 单值选择</h3>
            <p class="help" style="margin-bottom: 1rem;">
                读方向：<code>el.checked = (state === el.value)</code>，写方向：仅勾选时 <code>state = el.value</code>。
                同名 radio 互斥，共享一个 state 值。必须声明 <code>value</code> 属性。
            </p>

            <div class="field">
                <label class="label">性别</label>
                <div class="radio-group">
                    <label class="radio">
                        <input type="radio" name="gender" value="male" x-model="form.gender" />
                        男
                    </label>
                    <label class="radio">
                        <input type="radio" name="gender" value="female" x-model="form.gender" />
                        女
                    </label>
                    <label class="radio">
                        <input type="radio" name="gender" value="other" x-model="form.gender" />
                        其他
                    </label>
                </div>
                <p class="help">gender = <strong x-text="form.gender"></strong></p>
            </div>

            <div class="field">
                <label class="label">学历</label>
                <div class="radio-group">
                    <label class="radio">
                        <input type="radio" name="education" value="high-school" x-model="form.education" />
                        高中
                    </label>
                    <label class="radio">
                        <input type="radio" name="education" value="bachelor" x-model="form.education" />
                        本科
                    </label>
                    <label class="radio">
                        <input type="radio" name="education" value="master" x-model="form.education" />
                        硕士
                    </label>
                    <label class="radio">
                        <input type="radio" name="education" value="phd" x-model="form.education" />
                        博士
                    </label>
                </div>
                <p class="help">education = <strong x-text="form.education"></strong></p>
            </div>

            <div class="buttons" style="margin-top: 1rem;">
                <button class="button is-primary is-light" type="button" @click="programSet">设置为「女 / 博士」（程序更新）</button>
                <button class="button is-light" type="button" @click="reset">重置</button>
            </div>

            <div class="result" x-text="JSON.stringify(form, null, 2)"></div>
        </div>

        <script>
            const { AutoTemplateEngine } = AutoTemplateSpaces;
            const engine = new AutoTemplateEngine(
                document.querySelector(".demo-app"),
                {
                    form: {
                        gender: "male",
                        education: "bachelor",
                    },
                },
                {
                    actions: {
                        programSet() {
                            engine.state.form.gender = "female";
                            engine.state.form.education = "phd";
                        },
                        reset() {
                            engine.state.form.gender = "male";
                            engine.state.form.education = "bachelor";
                        },
                    },
                },
            );
        </script>
    </body>
</html>
