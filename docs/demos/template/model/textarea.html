<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>x-model · textarea 双向绑定</title>
        <script src="/autostore/template.js"></script>
        <link rel="stylesheet" href="/autostore/bulma.min.css" />
    </head>

    <body>
        <!-- textarea 同样支持 x-model，统一读写 el.value -->
        <div class="demo-app section">
            <div class="field">
                <label class="label">备注：</label>
                <div class="control">
                    <textarea class="textarea" rows="3" x-model="form.remark"></textarea>
                </div>
            </div>
            <p class="help">已输入 <strong x-text="form.remark.length + ''"></strong> 字</p>
        </div>

        <script>
            const { AutoTemplateEngine } = AutoTemplateSpaces;
            const engine = new AutoTemplateEngine(document.querySelector(".demo-app"), {
                form: { remark: "初始备注内容" },
            });
        </script>
    </body>
</html>
