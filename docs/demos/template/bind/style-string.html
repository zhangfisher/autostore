<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>x-style · 字符串写法</title>
        <script src="/autostore/template.js"></script>
        <link rel="stylesheet" href="/autostore/template.css" />
    </head>

    <body>
        <!-- :style 接收字符串：作为 cssText 整体替换，连字符写法没问题（区别于对象写法的驼峰要求） -->
        <div class="demo-app">
            <p :style="msg.plain ? msg.plainCss : msg.warnCss">{{ msg.text }}</p>
            <button class="btn" @click="toggle">切换样式</button>
        </div>

        <script>
            const { AutoTemplateEngine } = AutoTemplateSpaces;
            const engine = new AutoTemplateEngine(
                document.querySelector(".demo-app"),
                {
                    msg: {
                        text: "字符串写法：cssText 整体替换",
                        plain: true,
                        // 字符串写法用连字符没问题，每段 cssText 须自包含全部声明
                        plainCss:
                            "color:#42b883;font-size:16px;padding:6px 12px;border-left:3px solid #42b883",
                        warnCss:
                            "color:#fff;background-color:#e07000;font-size:18px;font-weight:600;padding:8px 14px;border-radius:6px",
                    },
                },
                {
                    actions: {
                        toggle: () => {
                            engine.state.msg.plain = !engine.state.msg.plain;
                        },
                    },
                },
            );
        </script>
    </body>
</html>
