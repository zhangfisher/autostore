<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>x-style · 对象写法</title>
        <script src="/autostore/template.js"></script>
        <link rel="stylesheet" href="/autostore/bulma.min.css" />
    </head>

    <body>
        <!-- :style 接收对象：key 必须是驼峰（CSSStyleDeclaration 属性名），整体合并到 el.style -->
        <div class="demo-app section">
            <div class="block">
                <span :style="badge.solid ? badge.solidStyle : badge.ghostStyle">{{ badge.text }}</span>
            </div>
            <div class="buttons">
                <button class="button is-primary" @click="toggle">切换配色</button>
            </div>
        </div>

        <script>
            const { AutoTemplateEngine } = AutoTemplateSpaces;
            const engine = new AutoTemplateEngine(
                document.querySelector(".demo-app"),
                {
                    badge: {
                        text: "对象写法：多个驼峰属性一次合并",
                        // 布尔旗标驱动样式切换（避免对从 store 读出的对象做 === 比较）
                        solid: true,
                        // 注意：两套对象的 key 集合相同，切换时 Object.assign 合并无残留
                        solidStyle: {
                            color: "#fff",
                            backgroundColor: "#42b883",
                            fontSize: "14px",
                            padding: "4px 10px",
                            borderRadius: "4px",
                        },
                        ghostStyle: {
                            color: "#e07000",
                            backgroundColor: "#fef3e0",
                            fontSize: "16px",
                            padding: "6px 14px",
                            borderRadius: "999px",
                        },
                    },
                },
                {
                    actions: {
                        toggle: () => {
                            engine.state.badge.solid = !engine.state.badge.solid;
                        },
                    },
                },
            );
        </script>
    </body>
</html>
